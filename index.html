<title>MapTap Leaderboard</title>
<style>
  :root{
    --ink:#1c1b19;
    --paper:#f6f2ea;
    --paper-dim:#efe9dd;
    --line:#d9d0bd;
    --gold:#b8862f;
    --silver:#8b8b8b;
    --bronze:#a9642f;
    --accent:#2f6f5e;
    --accent-dim:#e4ede9;
    --red:#a13d2e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:3px double var(--ink);
  }
  .eyebrow{
    font-family:'Courier New',monospace;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--accent);
    margin-bottom:6px;
  }
  h1{
    font-size:38px;
    margin:0 0 4px;
    letter-spacing:.01em;
    font-weight:700;
  }
  .subtitle{
    font-family:'Courier New',monospace;
    font-size:12px;
    color:#6b6455;
  }

  .toggle-wrap{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:16px;
  }
  .toggle-btn{
    font-family:'Courier New',monospace;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:8px 14px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    border-radius:3px;
    transition:background .15s ease, color .15s ease;
  }
  .toggle-btn:hover{background:var(--paper-dim);}
  .toggle-btn.active{
    background:var(--ink);
    color:var(--paper);
  }

  .weighted-note{
    font-family:'Courier New',monospace;
    font-size:9.5px;
    color:#8a8272;
  }

  .min-games-toggle{
    margin-top:10px;
    text-align:center;
    display:none;
  }
  .min-games-toggle.visible{display:block;}
  .min-games-btn{
    font-family:'Courier New',monospace;
    font-size:10px;
    letter-spacing:.03em;
    background:none;
    border:none;
    color:#8a8272;
    text-decoration:underline;
    cursor:pointer;
    padding:2px;
  }
  .min-games-btn:hover{color:var(--accent);}

  .board{
    list-style:none;
    margin:0;
    padding:0;
  }

  .row{
    border-bottom:1px solid var(--line);
  }
  .row:first-child{border-top:1px solid var(--line);}

  .row-head{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    background:none;
    border:none;
    padding:14px 6px;
    cursor:pointer;
    font-family:inherit;
    color:inherit;
    text-align:left;
    transition:background .15s ease;
  }
  .row-head:hover{background:var(--paper-dim);}
  .row-head:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

  .rank{
    font-family:'Courier New',monospace;
    font-size:14px;
    width:30px;
    flex-shrink:0;
    color:#8a8272;
  }
  .rank.medal{font-size:19px; font-family:inherit;}

  .name{
    flex:1;
    font-size:19px;
    font-weight:600;
  }

  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
    flex-shrink:0;
  }
  .avg{
    font-size:19px;
    font-weight:700;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
  }
  .games{
    font-family:'Courier New',monospace;
    font-size:10.5px;
    color:#8a8272;
    letter-spacing:.03em;
  }

  .chev{
    width:10px;
    flex-shrink:0;
    transition:transform .2s ease;
    color:#8a8272;
  }
  .row.open .chev{transform:rotate(90deg);}

  .history{

    transition:max-height .28s ease;
    background:var(--paper-dim);
  }
  .row.open .history{ /* max-height set via JS */ }

  .history-inner{

  }
  .hist-list{
    list-style:none;
    margin:0;
    padding:0;
    border-left:2px solid var(--line);
  }
  .hist-item{

    justify-content:space-between;

    padding:6px 0 6px 16px;
    font-size:14px;
  }

    .avg{font-size:16px;}
    .history-inner{padding-left:34px;}

// group
const groups = {};
raw.forEach(([name,date,score])=>{
  if(!groups[name]) groups[name] = [];
  groups[name].push({date,score});
});

// global average across every game, every player (used for weighted/shrinkage calc)
const allScores = raw.map(r=>r[2]);
const globalAvg = allScores.reduce((a,b)=>a+b,0)/allScores.length;
const K = 8; // shrinkage constant: "games of proof" needed before we trust your own average

// ---- Elo simulation ----
// Each day = a virtual round-robin: every player who posted a score that day is treated
// as having "played" every other player who posted that day. Higher final score wins.
// Dynamic K-factor: K=40 for a player's first 5 games (volatile, still finding their rank),
// K=20 once established (5+ games played). Everyone starts at 1000.
function computeElo(){
  const byDate = {};
  raw.forEach(([name,date,score])=>{
    if(!byDate[date]) byDate[date] = [];
    byDate[date].push({name,score});
  });
  const dates = Object.keys(byDate).sort();

  const elo = {};
  const gamesPlayed = {};
  raw.forEach(([name])=>{ if(!(name in elo)){ elo[name]=1000; gamesPlayed[name]=0; } });

  dates.forEach(date=>{
    const players = byDate[date];
    if(players.length < 2){
      players.forEach(p=>{ gamesPlayed[p.name]++; });
      return;
    }
    const startElo = {};
    players.forEach(p=>{ startElo[p.name] = elo[p.name]; });
    const deltas = {};
    players.forEach(p=>{ deltas[p.name] = 0; });

    for(let i=0;i<players.length;i++){
      for(let j=i+1;j<players.length;j++){
        const A = players[i], B = players[j];
        const ra = startElo[A.name], rb = startElo[B.name];
        const ea = 1/(1+Math.pow(10,(rb-ra)/400));
        const eb = 1-ea;
        let sa, sb;
        if(A.score > B.score){ sa=1; sb=0; }
        else if(A.score < B.score){ sa=0; sb=1; }
        else { sa=0.5; sb=0.5; }
        const ka = gamesPlayed[A.name] < 5 ? 40 : 20;
        const kb = gamesPlayed[B.name] < 5 ? 40 : 20;
        deltas[A.name] += ka*(sa-ea);
        deltas[B.name] += kb*(sb-eb);
      }
    }
    players.forEach(p=>{
      elo[p.name] += deltas[p.name];
      gamesPlayed[p.name]++;
    });
  });

  return elo;
}
const eloRatings = computeElo();

// per-player: sort history newest -> oldest, compute raw avg + weighted avg
const players = Object.keys(groups).map(name=>{
  const history = groups[name].slice().sort((a,b)=> b.date.localeCompare(a.date));
  const scores = history.map(h=>h.score);
  const n = scores.length;
  const avg = scores.reduce((a,b)=>a+b,0)/n;
  const weighted = (n/(n+K))*avg + (K/(n+K))*globalAvg;
  const elo = eloRatings[name];
  const max = Math.max(...scores);
  const min = Math.min(...scores);
  const maxDate = history.find(h=>h.score===max).date;
  return {name, history, avg, weighted, elo, games: n, max, min, maxDate};
});

const medals = {1:"🥇",2:"🥈",3:"🥉"};

function fmtDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[m-1]} ${d}`;
}

const btnRaw = document.getElementById('btn-raw');
const btnWeighted = document.getElementById('btn-weighted');
const btnElo = document.getElementById('btn-elo');
const btnBest = document.getElementById('btn-best');
const minGamesToggle = document.getElementById('min-games-toggle');
const btnToggleMin = document.getElementById('btn-toggle-min');

let mode = 'raw'; // 'raw' | 'weighted' | 'elo' | 'best'
let showAllRaw = false; // when true, ignores RAW_MIN_GAMES on the raw tab

const RAW_MIN_GAMES = 5; // Raw Average tab only shows players with at least this many games, unless toggled off

function render(){
  const pool = (mode === 'raw' && !showAllRaw) ? players.filter(p => p.games >= RAW_MIN_GAMES) : players;

  const sorted = pool.slice().sort((a,b)=>{
    const valOf = p => mode === 'raw' ? p.avg : mode === 'weighted' ? p.weighted : mode === 'elo' ? p.elo : p.max;
    return valOf(b) - valOf(a);
  });

  subtitle.textContent = mode === 'raw'
    ? (showAllRaw
        ? 'ranked by average final score (all players) \u00b7 tap a name for full history'
        : `ranked by average final score (${RAW_MIN_GAMES}+ games) \u00b7 tap a name for full history`)
    : mode === 'weighted'
    ? `ranked by weighted average (k=${K}) \u00b7 tap a name for full history`
    : mode === 'elo'
    ? 'ranked by Elo rating \u00b7 tap a name for full history'
    : 'ranked by all-time best score \u00b7 tap a name for full ranked list';

  minGamesToggle.classList.toggle('visible', mode === 'raw');
  btnToggleMin.textContent = showAllRaw
    ? `apply ${RAW_MIN_GAMES}-game minimum`
    : 'show all players (no 5-game min)';

  btnRaw.classList.toggle('active', mode === 'raw');
  btnWeighted.classList.toggle('active', mode === 'weighted');
  btnElo.classList.toggle('active', mode === 'elo');
  btnBest.classList.toggle('active', mode === 'best');

  board.innerHTML = '';

  sorted.forEach((p, idx)=>{
    const rank = idx+1;
    const li = document.createElement('li');
    li.className = 'row';

    const rankHtml = medals[rank]
      ? `<span class="rank medal">${medals[rank]}</span>`
      : `<span class="rank">${rank}.</span>`;

    const histItemsByDate = p.history.map(h=>{
      let cls = 'hist-score';
      if(h.score === p.max) cls += ' high';
      else if(h.score === p.min) cls += ' low';
      return `<li class="hist-item"><span class="hist-date">${fmtDate(h.date)}</span><span class="${cls}">${h.score}</span></li>`;
    }).join('');

    const histItemsByScore = p.history.slice().sort((a,b)=> b.score - a.score).map(h=>{
      let cls = 'hist-score';
      if(h.score === p.max) cls += ' high';
      else if(h.score === p.min) cls += ' low';
      return `<li class="hist-item"><span class="hist-date">${fmtDate(h.date)}</span><span class="${cls}">${h.score}</span></li>`;
    }).join('');

    const isChartPlayer = mode !== 'best'; // Best Scores tab always shows a plain ranked list, never the graph

    let displayVal, extraNote;
    if(mode === 'raw'){
      displayVal = p.avg.toFixed(0);
      extraNote = '';
    } else if(mode === 'weighted'){
      displayVal = p.weighted.toFixed(0);
      extraNote = `<span class="weighted-note">raw ${p.avg.toFixed(0)}</span>`;
    } else if(mode === 'elo'){
      displayVal = p.elo.toFixed(0);
      extraNote = `<span class="weighted-note">avg ${p.avg.toFixed(0)}</span>`;
    } else {
      displayVal = p.max;
      extraNote = `<span class="weighted-note">${fmtDate(p.maxDate)}</span>`;
    }

    const historyInnerHtml = isChartPlayer
      ? `<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
           <span style="font-family:'Courier New',monospace; font-size:10px; color:#8a8272; text-transform:uppercase; letter-spacing:.05em;">score history</span>
           <span class="chart-readout" style="font-family:'Courier New',monospace; font-size:11px; color:#8a8272;">tap a point</span>
         </div>
         <div style="position:relative; width:100%; height:220px;">
           <canvas class="hist-chart" role="img" aria-label="Line chart of ${p.name}'s MapTap score history"></canvas>
         </div>`
      : `<ul class="hist-list">${histItemsByScore}</ul>`;

    li.innerHTML = `
      <button class="row-head" aria-expanded="false">
        ${rankHtml}
        <span class="name">${p.name}</span>
        <span class="meta">
          <span class="avg">${displayVal}</span>
          ${extraNote}
          <span class="games">${p.games} game${p.games>1?'s':''}</span>
        </span>
        <span class="chev">&#9656;</span>
      </button>
      <div class="history">
        <div class="history-inner">
          ${historyInnerHtml}
        </div>
      </div>
    `;

    const btn = li.querySelector('.row-head');
    const hist = li.querySelector('.history');

    if(isChartPlayer){
      const chronological = p.history.slice().sort((a,b)=> a.date.localeCompare(b.date));
      const labels = chronological.map(h=>fmtDate(h.date));
      const scores = chronological.map(h=>h.score);
      const readout = li.querySelector('.chart-readout');
      const canvas = li.querySelector('.hist-chart');

      const THEME = '#1c1b19';   // --ink
      const PAPER = '#f6f2ea';   // --paper (hollow point center)
      const GREEN = '#008300';
      const RED = '#e34948';

      const pointColor = chronological.map(h=>
        h.score===p.max ? GREEN : h.score===p.min ? RED : THEME);
      const pointFill = chronological.map(()=> PAPER); // all hollow by default
      let selectedIdx = null;

      const chart = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: scores,
            borderColor: THEME,
            fill: false,
            tension: 0.25,
            borderWidth: 2,
            pointRadius: 6,
            pointHoverRadius: 7,
            pointBackgroundColor: pointFill.slice(),
            pointBorderColor: pointColor,
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: {
            y: { grid: { color: '#e1e0d9' }, ticks: { color: '#8a8272', font: {size: 10} } },
            x: { grid: { display: false }, ticks: { color: '#8a8272', font: {size: 9}, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 } }
          },
          onClick: (evt, elements) => {
            if(elements.length){
              const idx = elements[0].index;
              const fills = chart.data.datasets[0].pointBackgroundColor.slice();
              if(selectedIdx !== null) fills[selectedIdx] = PAPER;
              fills[idx] = pointColor[idx];
              chart.data.datasets[0].pointBackgroundColor = fills;
              chart.update();
              selectedIdx = idx;
              readout.textContent = labels[idx] + ' — ' + scores[idx];
              readout.style.color = 'var(--ink)';
              readout.style.fontWeight = '700';
            }
          },
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
          }
        }
      });
    }

    btn.addEventListener('click', ()=>{
      const isOpen = li.classList.contains('open');
      document.querySelectorAll('.row.open').forEach(other=>{
        if(other !== li){
          other.classList.remove('open');
          other.querySelector('.history').style.maxHeight = null;
          other.querySelector('.row-head').setAttribute('aria-expanded','false');
        }
      });
      if(isOpen){
        li.classList.remove('open');
        hist.style.maxHeight = null;
        btn.setAttribute('aria-expanded','false');
      } else {
        li.classList.add('open');
        hist.style.maxHeight = hist.scrollHeight + 'px';
        btn.setAttribute('aria-expanded','true');
      }
    });

    board.appendChild(li);
  });
}

btnRaw.addEventListener('click', ()=>{ mode = 'raw'; render(); });
btnWeighted.addEventListener('click', ()=>{ mode = 'weighted'; render(); });
btnElo.addEventListener('click', ()=>{ mode = 'elo'; render(); });
btnBest.addEventListener('click', ()=>{ mode = 'best'; render(); });
btnToggleMin.addEventListener('click', ()=>{ showAllRaw = !showAllRaw; render(); });

render();
</script>
</body>
</html>
